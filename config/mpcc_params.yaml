# MPCC Controller Parameters for F1Tenth (DynamicBicycle2D + Fiala tire model)

mpcc_controller:
  ros__parameters:
    # ============================================================================
    # Controller Settings
    # ============================================================================

    # Prediction horizon
    horizon_length: 20                # Number of prediction steps (N)
    dt: 0.05                          # Model timestep [s] — must equal 1/control_frequency
    control_frequency: 20.0           # Hz — must equal 1/dt (was 60 but model uses dt=0.05=20Hz)

    # ============================================================================
    # Cost Function Weights
    # ============================================================================

    # Contouring error (perpendicular to path centerline) — main "keep center" weight
    Q_c: 80.0

    # Lag error (along-path progress) — must be non-trivial to prevent drifting behind
    Q_l: 5.0

    # Heading error — KEEP LOW to avoid "turns early" before corners
    Q_theta: 80.0

    # Velocity tracking error
    Q_v: 50.0

    # Yaw-rate damping (oscillation reduction)
    Q_r: 15.0

    # Target speed [m/s]
    v_ref: 1.5

    # Input regularization: [delta_dot, tau_dot, v_psi]
    R_delta_dot: 50.0
    R_tau_dot: 0.1
    R_vpsi: 0.0

    # Desired path-progress rate [m/s] — should roughly match v_ref
    v_psi_ref: 1.5

    # ============================================================================
    # Vehicle Model Parameters (F1Tenth 1:10 scale)
    # ============================================================================

    a: 0.17                            # Front axle to CG [m]
    b: 0.16                            # Rear axle to CG [m]
    wheel_base: 0.3302
    body_length: 0.5
    body_width: 0.2032
    radius: 0.2
    m: 3.74                            # Vehicle mass [kg]
    Iz: 0.04                           # Yaw moment of inertia [kg*m^2]
    Cc_f: 300.0                        # Front cornering stiffness [N/rad]
    Cc_r: 300.0                        # Rear cornering stiffness [N/rad]
    mu: 1.0
    r_w: 0.0508                        # Wheel radius [m]
    gamma: 0.95

    # Input limits
    delta_max: 0.4189                  # 24 deg in radians
    delta_dot_max: 1.0472              # 60 deg/s in radians
    tau_max: 5.0
    tau_dot_max: 10.0

    # State limits
    v_max: 3.0
    v_min: 0.1
    r_max: 6.0
    beta_max: 0.7854                   # 45 deg in radians
    v_psi_max: 5.0

    # ============================================================================
    # Waypoint file
    # ============================================================================
    waypoints_file: "waypoints.csv"

    # ============================================================================
    # Visualization
    # ============================================================================
    visualize: true
